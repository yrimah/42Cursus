version: '3'
services:
  elasticsearch:
    container_name: elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    ports:
      - '9200:9200'
      - '9300:9300'
    networks:
      - transcendence
    restart: always
    env_file:
      - .env
    volumes:
      - elastic_files:/usr/share/elasticsearch/data
  logstash:
    container_name: logstash
    image: docker.elastic.co/logstash/logstash:8.12.0
    networks:
      - transcendence
    restart: always
    env_file:
      - .env
    volumes:
      - ./services/logs/logstash:/logstash_dir
    ports:
      - '9600:9600'
    depends_on:
      - elasticsearch
    command: logstash -f /logstash_dir/logstash.conf
  kibana:
    container_name: kibana
    image: docker.elastic.co/kibana/kibana:8.12.0
    ports:
      - '5601:5601'
    networks:
      - transcendence
    restart: always
    env_file:
      - .env
    depends_on:
      - elasticsearch
volumes:
  elastic_files:
    name: elastic_files
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: '/home/yrimah42/data/elastic_files'
networks:
  transcendence:
    name: transcendence
  
