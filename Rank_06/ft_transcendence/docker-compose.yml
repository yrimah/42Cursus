version: '3'
services:
  elasticsearch:
    container_name: elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    ports:
      - 9200:9200
    networks:
      - transcendence
    restart: always
  kibana:
    container_name: kibana
    image: docker.elastic.co/kibana/kibana:8.12.0
    ports:
      - 5601:5601
    networks:
      - transcendence
    restart: always
    depends_on:
      - elasticsearch
networks:
  transcendence:
    name: transcendence